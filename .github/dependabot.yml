version: 2
updates:
  # One root lockfile (npm workspaces), so a single npm entry covers both
  # apps/web and apps/server.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
