name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter so a frontend-only PR doesn't pay for the backend's
  # MongoDB-backed test suite, and vice versa. Runs everything on main.
  changes:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow default, so contents: read
    # must be restated or checkout of this private repo fails.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            web:
              - *shared
              - 'apps/web/**'
            server:
              - *shared
              - 'apps/server/**'

  server:
    name: server (lint, format, test)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    env:
      # Tests need a replica set (transactions), so they spin up their own
      # via mongodb-memory-server rather than using a plain mongo service
      # container. This just pins/caches the binary download location.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @edsync/server

      - name: Check formatting
        run: npm run format:check -w @edsync/server

      - name: Run tests
        run: npm test -w @edsync/server

  web:
    name: web (lint, format, build)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @edsync/web

      - name: Check formatting
        run: npm run format:check -w @edsync/web

      - name: Build
        run: npm run build -w @edsync/web
