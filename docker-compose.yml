services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # A single-node replica set, not a plain standalone mongod: invite
  # acceptance uses a multi-document transaction (register.service.js),
  # which MongoDB only supports on a replica set (or mongos). Runs on 27018
  # (not the default 27017) both inside and outside the container - a
  # replica set's advertised member host must match the port mongod
  # actually listens on itself, so remapping only the external side (e.g.
  # 27018->27017) makes rs.initiate() reject its own config. 27018 also
  # avoids colliding with a native MongoDB install some other project on
  # this machine may already have running on the default port.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --port 27018 --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: initiates the replica set on first run only (rs.status()
  # succeeding on later runs means it's already done, since that state
  # lives in the mongo-data volume).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --port 27018 --eval "
        try { rs.status(); }
        catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27018'}]}); }
      "

volumes:
  redis-data:
  mongo-data:
